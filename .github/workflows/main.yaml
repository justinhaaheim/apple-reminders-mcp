name: Build and Format Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain
        run: |
          swift --version
          xcode-select -p || true

      - name: Build Swift package
        shell: bash
        run: |
          set +e
          swift build -c release 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          echo "===END BUILD; rc=$rc==="
          tail -120 /tmp/build.log
          exit $rc

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting with Prettier
        run: bun run prettier-check
